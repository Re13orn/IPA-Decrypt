name: macOS release compatibility
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate (may be a draft)
        required: true
        default: v1.0.1
permissions:
  contents: read
jobs:
  packaged-app:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download candidate and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir candidate
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern SHA256SUMS --dir candidate
          cd candidate
          grep '\.dmg$' SHA256SUMS > macos.sha256
          test -s macos.sha256
          shasum -a 256 -c macos.sha256
      - name: Verify macOS 15 app and helper startup
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          mkdir "$RUNNER_TEMP/ipa-mount"
          hdiutil attach candidate/*.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/ipa-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/ipa-mount"' EXIT
          ditto "$RUNNER_TEMP/ipa-mount/IPA 解密.app" "$RUNNER_TEMP/IPA 解密.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/IPA 解密.app"
          python3 scripts/verify-installation.py --platform macos "$RUNNER_TEMP/IPA 解密.app"
          python3 scripts/smoke-macos.py "$RUNNER_TEMP/IPA 解密.app" --report candidate/macos15-smoke.json
